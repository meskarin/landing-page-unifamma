<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Chimira Store</title>
        <link rel="stylesheet" href="styles.css" />
      </head>
    <body>
        <header class="site-header">
            <section class="hero">
                <div class="container hero-grid">
                  <div class="hero-copy">
                    <p class="eyebrow">Sistema Web em Landing Page com API Fake Store</p>
                    <h1>Atividade de Extensão</h1>
                    <p class="lead">
                      Uma aplicação básica com integração com a API Fake Store para exibir produtos.
                    </p>
                  </div>
                  <form class="hero-form">
                    <h2>Cadastre-se</h2>
                    <p>Deixe seu nome e email para receber novidades.</p>
                    <label>
                      Nome
                      <input type="text" name="nome" placeholder="Seu nome" />
                    </label>
                    <label>
                      Email
                      <input type="email" name="email" placeholder="voce@exemplo.com" />
                    </label>
                    <button type="button" class="btn">Enviar</button>
                  </form>
                </div>
              </section>
          </main>
    </body>
</html>
